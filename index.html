<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e1a2e">
<title>The Chozeh</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Chozeh">
<meta name="mobile-web-app-capable" content="yes">

<style>
  html, body { margin: 0; min-height: 100%; background: #0e1a2e; color: #f5f6f7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
  .box { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
  .logo { width: 72px; height: 72px; margin: 0 auto; border-radius: 12px; background: #0e1a2e; }
  h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 26px; }
  p { margin: 0; color: #b4b8bf; font-size: 15px; line-height: 1.5; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input[type=password] { font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 1px solid #434c5c; background: #1f2a3d; color: #f5f6f7; text-align: center; }
  input[type=password]:focus { outline: 2px solid #5b8fe0; outline-offset: 1px; }
  label { display: flex; gap: 8px; align-items: center; justify-content: center; color: #b4b8bf; font-size: 14px; }
  button { font: inherit; font-size: 17px; font-weight: 600; padding: 12px; border: 0; border-radius: 10px; background: #5b8fe0; color: #0b0f19; cursor: pointer; }
  button:focus-visible { outline: 2px solid #f5f6f7; outline-offset: 2px; }
  button[disabled] { opacity: .6; }
  .err { color: #ff8080; }
  .opening form, .opening .ask { display: none; }
  .wait { display: none; }
  .opening .wait { display: block; }
</style>
</head>
<body>
<main>
  <div class="box" id="box">
    <img class="logo" src="icon-192.png" alt="">
    <h1>The Chozeh</h1>
    <p class="wait">Opening…</p>
    <p class="ask">Enter the password to open</p>
    <form id="f">
      <input id="pw" type="password" autocomplete="current-password" aria-label="Password" required>
      <label><input id="rem" type="checkbox" checked> Remember on this device</label>
      <button id="go" type="submit">Open</button>
      <p id="err" class="err" hidden>Wrong password</p>
    </form>
  </div>
</main>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (buf) => { let s = ''; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__spInstallPrompt = e; });
async function open(key) {
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)));
  if (document.readyState !== 'complete') await new Promise((r) => window.addEventListener('load', r, { once: true }));
  document.open(); document.write(html); document.close();
}
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
// The device remembers the unlock key, not the password, so later opens skip the slow step.
const KEY = "pulse-key-a1fb762e";
const store = { get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }, clear() { try { localStorage.removeItem(KEY); } catch (e) {} } };
const box = document.getElementById('box');
const saved = store.get();
if (saved) {
  box.classList.add('opening');
  crypto.subtle.importKey('raw', b64(saved), { name: 'AES-GCM' }, false, ['decrypt']).then(open)
    .catch(() => { store.clear(); box.classList.remove('opening'); document.getElementById('pw').focus(); });
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const go = document.getElementById('go');
  go.disabled = true;
  document.getElementById('err').hidden = true;
  try {
    const key = await keyFrom(document.getElementById('pw').value);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)); // throws on a wrong password
    if (document.getElementById('rem').checked) store.set(toB64(await crypto.subtle.exportKey('raw', key))); else store.clear();
    await open(key);
  } catch (err) {
    store.clear();
    document.getElementById('err').hidden = false;
    go.disabled = false;
  }
});
</script>
